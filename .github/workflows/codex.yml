name: Codex plugin
on:
  push:
    branches: [main, codex-plugin]
  pull_request:
jobs:
  codex:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate package and skill links
        run: python -X utf8 scripts/validate-codex.py
      - name: Test state, closure gates and isolated install
        run: python -X utf8 -m unittest discover -s tests -v
